name: Binance Self-Hosted Testnet Smoke

on:
  push:
    branches:
      - test/binance-self-hosted-smoke

permissions:
  contents: read

concurrency:
  group: binance-self-hosted-testnet-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[binance-self-hosted-smoke]')
    runs-on: [self-hosted, linux, binance-testnet]
    timeout-minutes: 10
    env:
      PYTHONPATH: "."
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Binance Testnet network access
        run: python scripts/check_binance_testnet_access.py

      - name: Validate Testnet secrets
        shell: bash
        run: |
          if [ -z "$BINANCE_TESTNET_API_KEY" ] || [ -z "$BINANCE_TESTNET_API_SECRET" ]; then
            echo "Missing Binance Testnet repository secrets."
            exit 1
          fi

      - name: Signed Binance Spot Testnet preflight only
        run: |
          python scripts/run_binance_testnet_order.py \
            --mode preflight \
            --symbol "BTC/USDT" \
            --side buy \
            --notional-usdt "10" \
            --confirm ""

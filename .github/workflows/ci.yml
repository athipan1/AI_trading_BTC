name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  hermes3d-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: cp .env.example .env
      - name: Validate Compose wiring
        run: docker compose -f docker-compose.yml -f docker-compose.hermes3d.yml config
      - name: Build pinned Hermes3D Trading Room
        run: docker build -f deploy/hermes3d/Dockerfile -t ai-trading-btc-hermes3d:test .
